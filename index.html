<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gabriel Hausberger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <div class="intro">

            <div class="intro-text">

                <h1>Gabriel Hausberger</h1>

                <nav>
                    <a href="#home" class="nav-link active">home</a>
                    <a href="#about" class="nav-link">about</a>
                    <a href="#notes" class="nav-link">notes</a>
                    <a href="#projects" class="nav-link">projects</a>
                    <a href="#reading" class="nav-link">reading</a>
                    <a href="#contact" class="nav-link">contact</a>
                </nav>

                <footer>
                    <a href="#">github</a>
                    <a href="#">cv</a>
                </footer>

            </div>

            <div id="content-panel" class="content-panel" aria-live="polite"></div>

        </div>

    </main>

    <script>
        const NOTES_INDEX_URL = 'notes.json';
        let notes = [];

        const pageContent = {
            home: `
                <img class="profile-photo" src="images/BackgroundPic.jpg" alt="Gabriel Hausberger">
            `,
            about: `
                <div class="page-copy">
                    <h2>About</h2>
                    <p>I'm an Austrian-Brazilian undergraduate student of applied mathematics at Duke University and 昆山杜克大学，currently based in China. I have lived in Curitiba, Harbin, and now Kunshan.<br><br> I am interested in mathematics, machine learning, quant finance, fashion, photography, philosophy and China. <br><br> Particularly, I am drawn to philosophy of time, memory, impermanence, solitude, desire, attention, existentialism, absurdism, phenomenology, asceticism and aesthetic. While a large list, they of course overlap. <br><br>Feel free to contact me to chat about any topic :) </p>
                </div>
            `,
            projects: `
                <div class="page-copy">
                    <h2>Projects</h2>
                    <p>Someday?</p>
                </div>
            `,
            reading: `
                <div class="page-copy">
                    <h2>Reading</h2>
                    <p>These are books I am currently reading or have read, and, sometimes, my thoughts about them.</p>
                </div>
            `,
            contact: `
                <div class="page-copy contact-page">
                    <h2>Contact</h2>
                    <p>gh176@duke.edu</p>
                    <p>gabriel.hausberger@dukekunshan.edu.cn</p>
                </div>
            `
        };

        const contentPanel = document.getElementById('content-panel');
        const navLinks = document.querySelectorAll('.nav-link');

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function parseMarkdownToHtml(markdown) {
            const lines = (markdown || '').trim().split(/\n/);
            let html = '';
            let inList = false;

            const parseInline = (text) => {
                let parsed = escapeHtml(text);
                parsed = parsed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                parsed = parsed.replace(/\*(.+?)\*/g, '<em>$1</em>');
                parsed = parsed.replace(/`([^`]+)`/g, '<code>$1</code>');
                parsed = parsed.replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
                return parsed;
            };

            lines.forEach((line) => {
                if (line.startsWith('### ')) {
                    html += `<h3>${parseInline(line.replace(/^###\s*/, ''))}</h3>`;
                    inList = false;
                    return;
                }

                if (line.startsWith('## ')) {
                    html += `<h2>${parseInline(line.replace(/^##\s*/, ''))}</h2>`;
                    inList = false;
                    return;
                }

                if (line.startsWith('# ')) {
                    html += `<h1>${parseInline(line.replace(/^#\s*/, ''))}</h1>`;
                    inList = false;
                    return;
                }

                if (/^-\s+/.test(line)) {
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    html += `<li>${parseInline(line.replace(/^-\s*/, ''))}</li>`;
                    return;
                }

                if (inList) {
                    html += '</ul>';
                    inList = false;
                }

                if (line.trim() === '') {
                    return;
                }

                html += `<p>${parseInline(line)}</p>`;
            });

            if (inList) html += '</ul>';

            return html;
        }

        function parseFrontMatter(markdown) {
            let body = markdown;
            let date = '';
            let title = '';

            if (markdown.startsWith('---')) {
                const endIndex = markdown.indexOf('\n---', 4);
                if (endIndex !== -1) {
                    const frontMatter = markdown.slice(4, endIndex);
                    body = markdown.slice(endIndex + 5).trim();

                    const dateMatch = frontMatter.match(/date\s*:\s*["']?([^\n"']+)["']?/i);
                    const titleMatch = frontMatter.match(/title\s*:\s*["']?([^\n"']+)["']?/i);

                    if (dateMatch) date = dateMatch[1].trim();
                    if (titleMatch) title = titleMatch[1].trim();
                }
            }

            if (!date) {
                const dateMatch = markdown.match(/^(\d{4}-\d{2}-\d{2})/);
                if (dateMatch) date = dateMatch[1];
            }

            if (!title) {
                const titleMatch = markdown.match(/^#\s+(.+)$/m);
                if (titleMatch) title = titleMatch[1].trim();
            }

            if (!title) {
                const fallback = markdown.split('\n').find(line => line.trim() && !line.startsWith('---'));
                title = fallback ? fallback.replace(/^#+\s*/, '').trim() : 'Untitled';
            }

            return { date, title, body };
        }

        async function loadNotes() {
            try {
                const response = await fetch(NOTES_INDEX_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error('Unable to load notes list');

                const entries = await response.json();
                notes = Array.isArray(entries)
                    ? entries
                        .filter(entry => entry && entry.date && entry.title && entry.file)
                        .sort((a, b) => b.date.localeCompare(a.date))
                    : [];
            } catch (error) {
                console.error('Failed to load notes:', error);
                notes = [];
            }
        }

        function renderNotesCatalog() {
            return `
                <div class="page-copy notes-page">
                    <ul class="notes-list">
                        ${notes.map(note => `
                            <li class="notes-item-row">
                                <button class="note-item" type="button" data-note-index="${notes.indexOf(note)}">
                                    <span class="note-date">[${note.date}]</span>
                                    <span class="note-title">${note.title}</span>
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
        }

        async function renderNotePage(noteIndex) {
            const note = notes[Number(noteIndex)];
            if (!note) return '<div class="page-copy"><p>Note not found.</p></div>';

            try {
                const noteUrl = new URL(note.file, document.baseURI);
                const response = await fetch(noteUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error('Unable to load note file');
                const markdown = await response.text();
                const { title, date, body } = parseFrontMatter(markdown);

                return `
                    <div class="page-copy note-page">
                        <div class="note-header-row">
                            <button class="note-back" type="button" data-back="notes">←</button>
                            <h2>${title || note.title}</h2>
                        </div>
                        <div class="note-meta">[${date || note.date}]</div>
                        <div class="note-body">${parseMarkdownToHtml(body)}</div>
                    </div>
                `;
            } catch (error) {
                console.error('Failed to load note content:', error);
                return `<div class="page-copy"><p>Unable to load this note.</p></div>`;
            }
        }

        async function setPage(page, noteFile) {
            if (page === 'notes') {
                contentPanel.innerHTML = renderNotesCatalog();
                document.querySelectorAll('.note-item').forEach(button => {
                    button.addEventListener('click', () => setPage('note', button.dataset.noteIndex));
                });
            } else if (page === 'note') {
                contentPanel.innerHTML = '<div class="page-copy"><p>Loading…</p></div>';
                const noteMarkup = await renderNotePage(noteFile);
                contentPanel.innerHTML = noteMarkup;

                const backButton = document.querySelector('.note-back');
                if (backButton) {
                    backButton.addEventListener('click', () => setPage('notes'));
                }
            } else {
                contentPanel.innerHTML = pageContent[page] || pageContent.home;
            }

            navLinks.forEach(link => {
                const isActive = link.getAttribute('href') === '#' + (page === 'note' ? 'notes' : page);
                link.classList.toggle('active', isActive);
            });
        }

        navLinks.forEach(link => {
            link.addEventListener('click', function (event) {
                event.preventDefault();
                const page = this.getAttribute('href').replace('#', '');
                setPage(page === 'notes' ? 'notes' : page);
            });
        });

        async function init() {
            await loadNotes();
            setPage('home');
        }

        init();
    </script>

</body>

</html>

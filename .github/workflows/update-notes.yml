name: Update content indexes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-indexes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate content indexes
        run: |
          npm run generate-notes
          npm run generate-books

      - name: Commit generated indexes
        run: |
          git add notes.json books.json
          if git diff --cached --quiet -- notes.json books.json; then
            echo "Content indexes are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated content indexes [skip ci]"
          git push